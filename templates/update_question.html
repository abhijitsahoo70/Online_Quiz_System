<!DOCTYPE html>
<html>

<head>

    <title>Update Question</title>

    <link rel="stylesheet"
    href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

<div class="container">

<h1>Update Question</h1>

<form method="POST">

<input
type="text"
name="subject"
value="{{ question[1] }}"
required>

<input
type="text"
name="question"
value="{{ question[2] }}"
required>

<input
type="text"
name="option1"
value="{{ question[3] }}"
required>

<input
type="text"
name="option2"
value="{{ question[4] }}"
required>

<input
type="text"
name="option3"
value="{{ question[5] }}"
required>

<input
type="text"
name="option4"
value="{{ question[6] }}"
required>

<input
type="text"
name="answer"
value="{{ question[7] }}"
required>

<button type="submit">
Update Question
</button>

</form>

<br>

<a href="/edit_question">
<button>
Back
</button>
</a>

</div>

</body>

</html>
